<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#4338ca">
  <title>Participation list • Nyati Elan Cultural Forum</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f6f7fb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#e0e7ff 0,transparent 30%),#f8fafc}.wrap{width:min(1180px,calc(100% - 28px));margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:25px 0}.brand{font-weight:850;color:#202942;text-decoration:none}.back{color:#4f46e5;text-decoration:none;font-weight:700;font-size:.9rem}.intro{padding:30px 0 22px}.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:#4f46e5}.intro h1{font-size:clamp(2rem,5vw,3.4rem);letter-spacing:-.05em;margin:10px 0 8px}.intro p{color:#667085;margin:0;line-height:1.6}.panel{background:#fff;border:1px solid #e5e7ef;border-radius:20px;padding:18px;box-shadow:0 10px 30px #1720330a}.controls{display:grid;grid-template-columns:minmax(220px,1fr) 190px 190px;gap:10px;margin-bottom:18px}input,select{width:100%;border:1px solid #d8deeb;border-radius:12px;padding:12px 13px;background:#fff;color:#172033;font:inherit;outline:0}input:focus,select:focus{border-color:#6366f1;box-shadow:0 0 0 3px #6366f126}.summary{display:flex;justify-content:space-between;gap:12px;align-items:center;color:#667085;font-size:.9rem;margin:4px 2px 14px}.badge{display:inline-block;background:#eef2ff;color:#4338ca;border-radius:999px;padding:5px 10px;font-weight:800;font-size:.78rem}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.participant{border:1px solid #e8ebf2;border-radius:15px;padding:16px;background:linear-gradient(145deg,#fff,#fafbff)}.participant h2{font-size:1rem;margin:0 0 10px;color:#202942}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.tag{font-size:.75rem;border-radius:7px;padding:5px 8px;background:#f1f5f9;color:#475569}.activity{background:#ecfdf5;color:#047857}.details{display:grid;gap:5px;color:#667085;font-size:.86rem}.details b{color:#344054}.state{padding:38px 12px;text-align:center;color:#667085}.error{color:#b42318;background:#fff5f4;border:1px solid #fecdca;border-radius:12px;padding:14px}.skeleton{height:130px;border-radius:15px;background:linear-gradient(90deg,#f1f3f8 25%,#e6e9f2 37%,#f1f3f8 63%);background-size:400% 100%;animation:shine 1.3s infinite}@keyframes shine{to{background-position:-400% 0}}@media(max-width:760px){.controls{grid-template-columns:1fr}.topbar{padding-bottom:10px}}
  </style>
</head>
<body>
  <header class="wrap topbar"><a class="brand" href="index.html">Nyati Elan Cultural Forum</a><a class="back" href="app.html">Open community hub →</a></header>
  <main class="wrap">
    <section class="intro"><div class="eyebrow">Cultural activities</div><h1>Participation list</h1><p>Search registrations by participant, flat, building or activity.</p></section>
    <section class="panel" aria-live="polite">
      <div class="controls"><input id="search" type="search" placeholder="Search participant, flat or phone…" autocomplete="off"><select id="activity"><option value="">All activities</option></select><select id="age"><option value="">All age groups</option></select></div>
      <div class="summary"><span id="status">Loading registrations…</span><span class="badge" id="count">0 participants</span></div>
      <div id="list" class="grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
    </section>
  </main>
  <script>
    const API_URL='https://script.google.com/macros/s/AKfycbxGXYHXLjZlrnIpIaYkaIO5I-U1W1wOCbuVarEk9kRYKc7AR8MXRJUpmEyOTIWhzyp0/exec';
    const CACHE_KEY='nyati-participants-v1', CACHE_TTL=120000;
    let participants=[];
    const $=id=>document.getElementById(id);
    const clean=value=>String(value??'').trim();
    const normal=value=>clean(value).toLowerCase();
    function headerIndex(headers,tests){return headers.findIndex(h=>tests.some(test=>h.includes(test)))}
    function parseRows(rows){
      if(!Array.isArray(rows)||rows.length<2)return [];
      const headers=rows[0].map(normal);
      const idx={name:headerIndex(headers,['participant name','participant','name']),age:headerIndex(headers,['age group','age']),flat:headerIndex(headers,['building and flat','flat','unit']),phone:headerIndex(headers,['mobile','phone','contact']),activity:headerIndex(headers,['cultural activity','activity','activities']),notes:headerIndex(headers,['special notes','performance details','notes'])};
      return rows.slice(1).map(row=>({name:clean(row[idx.name]),age:clean(row[idx.age]),flat:clean(row[idx.flat]),phone:clean(row[idx.phone]),activity:clean(row[idx.activity]),notes:clean(row[idx.notes])})).filter(item=>item.name||item.flat||item.activity);
    }
    function splitActivities(value){return clean(value).split(/,|\n|;|\|/).map(v=>v.trim()).filter(Boolean)}
    function populateFilters(){
      const activities=[...new Set(participants.flatMap(p=>splitActivities(p.activity)))].sort((a,b)=>a.localeCompare(b));
      const ages=[...new Set(participants.map(p=>p.age).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
      $('activity').innerHTML='<option value="">All activities</option>'+activities.map(v=>`<option>${escapeHtml(v)}</option>`).join('');
      $('age').innerHTML='<option value="">All age groups</option>'+ages.map(v=>`<option>${escapeHtml(v)}</option>`).join('');
    }
    function escapeHtml(value){return clean(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function render(){
      const query=normal($('search').value), activity=normal($('activity').value), age=normal($('age').value);
      const filtered=participants.filter(p=>{const hay=normal([p.name,p.flat,p.phone,p.activity,p.notes].join(' '));return (!query||hay.includes(query))&&(!activity||splitActivities(p.activity).some(v=>normal(v)===activity))&&(!age||normal(p.age)===age)});
      $('count').textContent=`${filtered.length} participant${filtered.length===1?'':'s'}`;$('status').textContent=participants.length?`Showing ${filtered.length} of ${participants.length} registrations`:'No registrations found';
      $('list').innerHTML=filtered.length?filtered.map(p=>`<article class="participant"><h2>${escapeHtml(p.name||'Unnamed participant')}</h2><div class="meta">${splitActivities(p.activity).map(a=>`<span class="tag activity">${escapeHtml(a)}</span>`).join('')}${p.age?`<span class="tag">${escapeHtml(p.age)}</span>`:''}</div><div class="details">${p.flat?`<span>🏠 <b>${escapeHtml(p.flat)}</b></span>`:''}${p.phone?`<span>📱 ${escapeHtml(p.phone)}</span>`:''}${p.notes?`<span>📝 ${escapeHtml(p.notes)}</span>`:''}</div></article>`).join(''):'<div class="state" style="grid-column:1/-1">No matching participants. Try clearing a filter.</div>';
    }
    async function load(){
      try{
        const cached=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');
        if(cached&&Date.now()-cached.time<CACHE_TTL){participants=cached.data;populateFilters();render();$('status').textContent=`Updated ${new Date(cached.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`;return}
        const response=await fetch(`${API_URL}?action=getAllData`,{cache:'no-store'});if(!response.ok)throw new Error('Unable to load data');
        const payload=await response.json();participants=parseRows(payload?.data?.events||[]);localStorage.setItem(CACHE_KEY,JSON.stringify({time:Date.now(),data:participants}));populateFilters();render();
      }catch(error){$('list').innerHTML='<div class="error" style="grid-column:1/-1">Participation data could not be loaded. Please try again in a moment.</div>';$('status').textContent='Could not connect';console.error(error)}
    }
    $('search').addEventListener('input',render);$('activity').addEventListener('change',render);$('age').addEventListener('change',render);load();
  </script>
</body>
</html>
